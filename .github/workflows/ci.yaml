name: Verify Onboard
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      EXTRACTOR: fixture
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: onboard
          POSTGRES_PASSWORD: onboard
          POSTGRES_DB: onboard
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U onboard" --health-interval 3s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
