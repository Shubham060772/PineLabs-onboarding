services:
  postgres:
    image: postgres:16-alpine
    ports: ['127.0.0.1:54329:5432']
    environment:
      POSTGRES_USER: onboard
      POSTGRES_PASSWORD: onboard
      POSTGRES_DB: onboard
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onboard']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
